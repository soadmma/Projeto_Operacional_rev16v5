{% extends 'base/base.html' %}

{% block title %}Aprovar Orçamento{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card shadow-lg p-4 w-100" style="max-width: 600px; border-radius: 2rem; background: linear-gradient(135deg, #f8faff 80%, #e6e6ff 100%);">
        <div class="text-center mb-4">
            <div style="width: 80px; height: 80px; margin: 0 auto; background: linear-gradient(135deg, #28a745 60%, #20c997 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(40,167,69,0.15);">
                <i class="fas fa-check fa-2x text-white"></i>
            </div>
            <h2 class="fw-bold mt-3 mb-1" style="letter-spacing: 1px; color: #28a745;">Aprovar Orçamento</h2>
            <p class="text-muted mb-0">Confirme a aprovação do orçamento #{{ orcamento.id }}</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_justificativa" class="form-label">Justificativa <span class="text-danger">*</span></label>
                <textarea name="justificativa" id="id_justificativa" class="form-control" rows="4" required placeholder="Digite a justificativa para aprovação do orçamento"></textarea>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-4">
                <a href="{% url 'orcamentos:detalhe' orcamento.id %}" class="btn btn-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i> Voltar
                </a>
                <button type="submit" class="btn btn-success px-4 shadow-sm" style="font-size: 1.1rem;">
                    <i class="bi bi-check-lg me-1"></i> Confirmar Aprovação
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
